plugins { id "com.android.application" }
android {
    namespace "com.citeamotors.portal"
    compileSdk 34
    defaultConfig {
        applicationId "com.citeamotors.portal"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [hostName: "teams.citeamotors.com", launchUrl: "https://teams.citeamotors.com/"]
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KS_FILE") ?: "release.jks")
            storePassword System.getenv("KS_PASS")
            keyAlias "citea"
            keyPassword System.getenv("KS_PASS")
        }
    }
    buildTypes { release { minifyEnabled false; if (System.getenv("KS_PASS")) signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0" }
