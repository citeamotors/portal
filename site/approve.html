<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Your estimate &#x2013; Citea Motors</title>
<link rel="icon" href="https://teams.citeamotors.com/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="https://teams.citeamotors.com/favicon.svg">
<link rel="apple-touch-icon" href="https://teams.citeamotors.com/apple-touch-icon.png">
<meta property="og:site_name" content="Citea Motors">
<meta property="og:title" content="Citea Motors &#xb7; Service | Sales | Collision">
<meta property="og:description" content="Your estimate and invoice from Citea Motors, Las Vegas.">
<meta property="og:image" content="https://asobgojrhatjpazgwnjp.supabase.co/storage/v1/object/public/deploy/portal/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
  :root{--ink:#111;--graphite:#3D3D3D;--steel:#686868;--hairline:#DADAD7;--paper:#F5F5F3;--surface:#fff;--black:#000;--sub:#EDEDEA;--red:#C8201F;--green:#1E7F4F;
    --sans:"Montserrat",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
  *{box-sizing:border-box;border-radius:0}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
  button,input{font:inherit;color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:0 0 calc(110px + env(safe-area-inset-bottom))}
  .demo{background:var(--sub);color:var(--graphite);font-size:11.5px;text-align:center;padding:7px 12px;letter-spacing:.02em}
  header{background:var(--black);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 20px 0}
  header img{height:46px;display:block}
  .svc{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:10.5px;font-weight:500;letter-spacing:.26em;color:#fff}
  .svc i{width:1px;height:11px;background:#fff;display:block}
  .bar{height:12px;background:var(--black);border-top:1px solid #333;margin:18px -20px 0}
  .shop{font-size:12px;color:#bdbdbb;margin-top:8px;line-height:1.5}
  section{padding:0 16px}
  .hello{padding:22px 16px 6px}
  .eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--steel)}
  h1{font-weight:300;font-size:26px;letter-spacing:.06em;text-transform:uppercase;margin:6px 0 4px;line-height:1.15}
  .muted{color:var(--steel)}
  .card{background:var(--surface);border:1px solid var(--hairline);margin:14px 0 0;padding:16px}
  .veh{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:13.5px}
  .veh b{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);font-weight:600;margin-bottom:2px}
  .mono{font-family:var(--mono)}
  .note{border-left:4px solid var(--ink);font-size:14px;line-height:1.55}
  .note .who{font-size:12px;color:var(--steel);margin-top:8px}
  h2{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin:28px 16px 0;padding-bottom:8px;border-bottom:2px solid var(--ink)}
  .job{padding:0}
  .job-top{padding:16px 16px 12px}
  .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;margin-bottom:8px}
  .tag.now{background:var(--red);color:#fff}.tag.soon{background:var(--sub);color:var(--graphite)}
  .job h3{margin:0 0 4px;font-size:17px;font-weight:600}
  .job p{margin:0;font-size:13.5px;line-height:1.5;color:var(--graphite)}
  .jt{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
  .jt span{font-size:12px;color:var(--steel)}
  .jt b{font-family:var(--mono);font-size:19px}
  details{border-top:1px solid var(--hairline)}
  summary{list-style:none;cursor:pointer;padding:11px 16px;font-size:12.5px;font-weight:600;color:var(--graphite)}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";float:right;font-family:var(--mono)}
  details[open] summary::after{content:"\2013 "}
  .lines{padding:0 16px 12px;font-size:13px}
  .ln{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--hairline)}
  .ln:last-child{border:0}
  .ln span:last-child{font-family:var(--mono);white-space:nowrap}
  .ln small{display:block;color:var(--steel);font-size:11.5px}
  .inv-tn .tn{white-space:pre-wrap;padding:10px 12px;font-size:13.5px;line-height:1.5}
  .ins .ins-h{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:4px 0 6px}.ins .ins-h~.ins-h{margin-top:18px}
  .ins-g{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin:12px 0 2px;font-weight:700}
  .ins-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--hairline);font-size:14px}
  .ins-l{min-width:0}.ins-l small{display:block;color:var(--steel);font-size:12.5px;margin-top:2px;white-space:pre-wrap}
  .ins-r{flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;color:#fff;background:#686868}
  .ins-r.r-ok{background:#1F8A4C}.ins-r.r-watch{background:#C99A06}.ins-r.r-repair{background:#C8201F}
  .ins-p{font-size:13.5px;color:var(--steel);margin:4px 0 8px}
  .rc-ins{margin-top:14px}.rc-ins .band{margin-top:10px}.rc-ins .ins-row{font-size:12.5px;padding:5px 10px}.rc-ins .ins-g{padding:0 10px}.rc-ins .ins-p{padding:0 10px}
  .rc-card .band{display:none}.rc-card .rc-pre{margin:0;padding:0;border:0}.rc-card p,.rc-card li{margin:0;font-size:14.5px;line-height:1.5}
  .tn-txt{white-space:pre-wrap;font-size:14.5px;line-height:1.5}
  .jnotes{white-space:pre-wrap;font-size:13.5px;padding:8px 10px;margin:4px 0 6px;border-left:3px solid var(--hairline);background:rgba(127,127,127,.08)}
  .jnotes b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin-bottom:2px}
  .inv-note{white-space:pre-wrap;font-size:12px;margin:6px 0 4px;padding:6px 8px;border:1px solid #ccc}
  .choice{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--hairline)}
  .choice button{border:0;background:var(--surface);padding:15px 8px;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--steel)}
  .choice button+button{border-left:1px solid var(--hairline)}
  .job.approved .choice .ok{background:var(--ink);color:#fff}
  .job.declined .choice .no{background:var(--sub);color:var(--ink)}
  .job.declined{opacity:.72}
  .job.declined h3{text-decoration:line-through}
  .job.approved{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--ink)}
  .sum .ln{border:0;padding:5px 0;font-size:14px}
  .sum .tot{border-top:2px solid var(--ink);margin-top:8px;padding-top:10px;font-weight:700;font-size:16px}
  .sum .tot span:last-child{font-size:22px}
  .sum .dec{color:var(--steel);font-size:12.5px;margin-top:6px}
  label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);margin:16px 0 6px}
  input[type=text]{width:100%;font-size:17px;padding:12px;border:1px solid var(--hairline);background:var(--surface);outline:none}
  input[type=text]:focus{border-color:var(--ink)}
  .sigbox{position:relative;border:1px solid var(--hairline);background:var(--surface);height:170px;touch-action:none}
  .sigbox.on{border-color:var(--ink)}
  /* required boxes: red until filled in, green once done */
  .req{border:2px solid #C8201F!important;background:#FDF3F3!important}
  .req.done{border-color:#2E7D32!important;background:#F2F8F3!important}
  label.agree.req{padding:12px}
  .req-tag{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#C8201F}
  .req-tag.done{color:#2E7D32}
  canvas{display:block;width:100%;height:100%}
  .sigline{position:absolute;left:16px;right:16px;bottom:38px;border-bottom:1px solid var(--hairline);pointer-events:none}
  .sigx{position:absolute;left:16px;bottom:42px;font-size:18px;color:var(--steel);pointer-events:none}
  .sighint{position:absolute;inset:0;display:grid;place-items:center;color:#b5b5b2;font-size:14px;pointer-events:none}
  .clear{position:absolute;right:8px;top:8px;border:1px solid var(--hairline);background:var(--surface);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;cursor:pointer}
  .terms{font-size:12.5px;line-height:1.55;color:var(--graphite);margin-top:14px}
  .free-note{margin:0 0 4px;padding:12px 14px;border-left:4px solid #1F8A4C;background:rgba(31,138,76,.08);font-size:14.5px;line-height:1.45;color:#111;font-weight:600}
  .agree{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13.5px;line-height:1.45;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500}
  .agree input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--ink)}
  .cta{position:fixed;left:0;right:0;bottom:0;background:var(--black);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:5}
  .cta-in{max-width:528px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .cta small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#aaa}
  .cta b{font-family:var(--mono);font-size:21px}
  .btn{flex:1;border:0;background:var(--red);color:#fff;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13.5px;padding:15px 10px;cursor:pointer}
  .btn:disabled{background:#4a4a4a;color:#999;cursor:not-allowed}
  .err{color:var(--red);font-size:13px;margin-top:10px;min-height:1em}
  .done{padding:28px 16px}
  .check{width:62px;height:62px;background:var(--green);display:grid;place-items:center;margin-bottom:16px}
  .check svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:3}
  .rec img{width:100%;max-width:300px;border-bottom:1px solid var(--ink);display:block;margin:6px 0}
  .rec .ln{font-size:13.5px}
  footer{padding:26px 16px 0;font-size:12px;color:var(--steel);line-height:1.6;text-align:center}
  footer a{color:var(--ink)}
  .hidden{display:none!important}
  .hint{font-size:12.5px;color:var(--steel);line-height:1.45}

  .ghost{background:var(--surface);color:var(--ink);border:1px solid var(--hairline)}
  .center{padding:40px 16px;text-align:center}
  .decline{display:block;width:100%;margin-top:10px;background:none;border:0;color:var(--steel);font-size:13px;text-decoration:underline;cursor:pointer;padding:10px}
  .loading{padding:60px 16px;text-align:center;color:var(--steel)}

  /* ---------- follow-your-repair page ---------- */
  .steps{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:4px}
  .steps div{height:8px;background:var(--sub)}
  .steps div.on{background:var(--ink)}
  .steps div.cur{background:var(--red)}
  .stepnames{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:6px;font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--steel);line-height:1.25}
  .stepnames span.cur{color:var(--ink)}
  .now{font-size:20px;font-weight:600;margin:14px 0 2px}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:13.5px;margin-top:12px}
  .facts b{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);font-weight:600;margin-bottom:2px}
  .task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--hairline);font-size:14px}
  .task:last-child{border:0}
  .tick{flex:none;width:22px;height:22px;border:2px solid #BDBDBA;display:grid;place-items:center;margin-top:1px}
  .task.ok .tick{background:var(--green);border-color:var(--green)}
  .task.ok .tick svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3.5}
  .task small{display:block;color:var(--steel);font-size:12px;margin-top:2px}
  .task.live .tick{border-color:var(--green);background:var(--green);animation:pulse 1.6s ease-in-out infinite}
  .task.live small{color:var(--green);font-weight:600}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  a.tlink{color:#1E6FD9;font-weight:600;text-decoration:underline}
  .meter{height:6px;background:var(--sub);margin-top:10px}.meter i{display:block;height:100%;background:var(--green)}
  .pay-amt{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .pay-amt button{border:1px solid var(--hairline);background:var(--surface);padding:9px 12px;font-weight:600;font-size:13px;cursor:pointer}
  .pay-amt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  input.amt{width:100%;font:600 22px var(--mono);padding:10px 12px;border:1px solid var(--hairline);background:var(--surface);outline:none;margin-top:8px}
  input.amt:focus{border-color:var(--ink)}
  .methods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .methods button{text-align:left;border:1px solid var(--hairline);background:var(--surface);padding:12px;cursor:pointer;font-size:14px;font-weight:600;line-height:1.25}
  .methods button small{display:block;font-weight:500;font-size:11.5px;color:var(--steel);margin-top:3px}
  .methods button.on{border:2px solid var(--ink);padding:11px}
  .howto{margin-top:14px;font-size:14px;line-height:1.55}
  .howto .ln{font-size:14px}
  .copyrow{display:flex;gap:8px;align-items:center;margin-top:8px}
  .copyrow code{flex:1;font:600 15px var(--mono);background:var(--sub);padding:10px;word-break:break-all}
  .copyrow button{border:1px solid var(--ink);background:var(--surface);padding:10px 12px;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  a.btn{display:block;text-align:center;text-decoration:none;margin-top:12px}
  a.brand-btn{display:flex;align-items:center;justify-content:center;gap:12px;min-height:56px}
  a.brand-btn .pw{font-weight:700}
  a.brand-btn .lchip{display:inline-flex;align-items:center}
  a.brand-btn .lchip .blogo{filter:brightness(0) invert(1)}
  .blogo{height:26px;width:auto;max-width:100%;display:block} .has-logo .bname{display:none}
  .methods .m-snap,.methods .m-affirm{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff}
  a.brand-btn .pw{font-size:17px;letter-spacing:.12em}
  a.b-affirm .blogo{height:27px} a.b-snap .blogo{height:36px}
  a.brand-btn .lchip .bname{color:#fff}
  .feenote{font-size:12px;color:var(--steel);margin-top:12px;line-height:1.5}

  /* ---------- one-link page: invoice ---------- */
  .printbtn{display:block;width:100%;margin-top:10px;flex:none}
  details.paylater{border:0;margin-top:22px}
  details.paylater>summary{margin:0 16px;padding:12px 0;border-bottom:2px solid var(--ink);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
  .inv{background:#fff;color:#111;padding:18px 16px;font-size:12px;font-family:var(--sans)}
  .inv-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .inv-head img{width:50%;max-width:230px}
  .inv-shop{text-align:right;font-size:10.5px;line-height:1.5;color:#333}
  .svcl{font-weight:600;letter-spacing:.14em;font-size:9px}.svcl i{display:inline-block;width:0;height:9px;border-left:1px solid #111;margin:0 6px;vertical-align:-1px}
  .inv{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .inv-title{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid #000;margin:14px 0 10px;padding-bottom:6px}
  .inv-title span:first-child{font-size:22px;font-weight:300;letter-spacing:.18em;text-transform:uppercase}
  .inv-title b{font:700 16px var(--mono);margin-left:6px}
  .inv-bars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:#d6d6d3;border:1px solid #d6d6d3}
  .inv-bars>div{background:#fff;padding:8px;line-height:1.45;font-size:11px;word-break:break-word}
  .inv-bars b{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#686868}
  .inv-job{margin-top:12px}
  .inv-job .band{background:#d9d9d6;font-weight:700;padding:5px 8px;font-size:12px;display:flex;justify-content:space-between;gap:10px}
  .inv-cols{display:grid;grid-template-columns:52px 1fr 92px 62px 70px 78px;gap:0;margin-top:12px;padding:0 6px 4px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#686868;font-weight:600;border-bottom:1px solid #111}
  .inv-cols .r{text-align:right}
  .inv-job col.c1{width:52px}.inv-job col.c3{width:92px}.inv-job col.c4{width:62px}.inv-job col.c5{width:70px}.inv-job col.c6{width:78px}
  .inv-job table{table-layout:fixed}
  .inv-job td.pn{font-size:10px;word-break:break-all}
  .inv-job td.nt{white-space:pre-wrap;font-style:italic}
  .inv-fine{margin-top:22px;font-size:9.5px;line-height:1.5;color:#444;border-top:1px solid #ccc;padding-top:8px}
  .inv-job table{width:100%;border-collapse:collapse;font-size:11px}
  .inv-job th{text-align:left;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#686868;font-weight:600;padding:5px 6px;border-bottom:1px solid #ccc}
  .inv-job td{padding:5px 6px;border-bottom:1px dashed #e2e2df;vertical-align:top}
  .inv-job .r{text-align:right;font-family:var(--mono);white-space:nowrap}
  .jobsum{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:4px 18px;font:11px var(--mono);padding:5px 6px 8px;border-top:1px solid #bbb}
  .inv-tot{margin:14px 0 0 auto;max-width:280px;font-size:12px}
  .inv-tot div{display:flex;justify-content:space-between;padding:3px 0}.inv-tot span:last-child{font-family:var(--mono)}
  .inv-tot .g{border-top:2px solid #000;margin-top:4px;padding-top:6px;font-weight:700;font-size:13.5px}
  .inv-sign{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin-top:30px}
  .inv-sign div{border-top:1px solid #111;padding-top:4px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#686868}
  #printArea{display:none}
  .rc-pre{margin:14px 0 0;break-inside:avoid;font-size:11px}.rc-pre .band{color:#111;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:0 0 4px;border-bottom:2px solid #111}.rc-pre p{margin:6px 0 4px}.rc-pre ul{margin:0;padding-left:18px}.rc-pre li{margin:2px 0}
  .rc-appr{margin:14px 0 0;font-size:11.5px;padding:6px 8px;border:1px solid #111}
  .rc-ph{margin-top:16px;break-inside:avoid}
  .rc-ph .band{color:#111;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:0 0 4px;border-bottom:2px solid #111}
  .rc-gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
  .rc-gal img{width:100%;height:150px;object-fit:cover;display:block;border:1px solid #ccc;break-inside:avoid}
  .rc-terms{margin-top:18px;padding-top:8px;border-top:2px solid #111;font-size:9.5px;line-height:1.5;color:#333;break-inside:avoid}
  .rc-terms b{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#111;margin-bottom:4px}
  .rc-terms p{margin:0 0 5px}
  .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gal a{display:block;aspect-ratio:1;background:var(--sub);overflow:hidden}.gal img{width:100%;height:100%;object-fit:cover;display:block}
  .smsok{text-transform:none!important;letter-spacing:0!important;font-size:14px!important;color:var(--ink)!important;font-weight:500!important}
  @media (max-width:420px){ .inv-bars{grid-template-columns:1fr 1fr} .inv-bars>div:last-child{grid-column:1/-1} .inv-cols{grid-template-columns:44px 1fr 56px 70px}.inv-cols .pn,.inv-cols .sl,.inv-job .pn,.inv-job .sl{display:none} }
  @media print{
    html,body.print-inv{background:#fff!important}
    body.print-inv>*:not(#printArea){display:none!important}
    body.print-inv #printArea{display:block!important}
    body.print-inv #printArea .inv{padding:0}
    body.print-inv .inv-cols{grid-template-columns:52px 1fr 92px 62px 70px 78px} body.print-inv .inv-cols .pn,body.print-inv .inv-cols .sl{display:block} body.print-inv .inv-job .pn,body.print-inv .inv-job .sl{display:table-cell} body.print-inv .inv-job col.pn,body.print-inv .inv-job col.sl{display:table-column}
    body.print-inv .inv-job{break-inside:avoid} body.print-inv .inv-fine,body.print-inv .inv-sign,body.print-inv .inv-close{break-inside:avoid}
    body.print-inv .inv-bars{grid-template-columns:1fr 1fr 1fr}
    @page{margin:12mm}
  }
  .lb{position:fixed;inset:0;z-index:9990;background:#000;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
  .lb-top{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));color:#fff;font-size:14px;z-index:2}
  .lb-top .spacer{flex:1}
  .lb-x{width:44px;height:44px;border:0;background:#1F1F1F;color:#fff;font-size:28px;line-height:1;cursor:pointer}
  .lb-act{height:44px;padding:0 14px;border:1px solid #fff;background:transparent;color:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .lb-stage{flex:1;overflow:hidden;position:relative}
  .lb-track{display:flex;height:100%;transition:transform .28s ease}
  .lb-slide{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center}
  .lb-slide img{max-width:100%;max-height:100%;object-fit:contain;display:block;-webkit-user-drag:none;pointer-events:none}
  .lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:72px;border:0;background:rgba(31,31,31,.75);color:#fff;font-size:40px;line-height:1;cursor:pointer;z-index:2}
  .lb-prev{left:10px}.lb-next{right:10px}.lb-prev[disabled],.lb-next[disabled]{opacity:.25;cursor:default}
  .lb-dots{display:flex;justify-content:center;gap:6px;padding:10px 0 max(14px,env(safe-area-inset-bottom))}.lb-dots i{width:7px;height:7px;background:#555}.lb-dots i.on{background:#C8201F}
  @media (max-width:700px){ .lb-prev,.lb-next{display:none} }
</style>

    const approvedTotal=()=>{ const sub=jobs.filter(x=>pick[x.key]).reduce((a,x)=>a+Number(x.total||0),0); const any=jobs.some(x=>pick[x.key]);

    if(data.error==="expired") return message("This link has expired","Estimates are only open for a limited time. Call or text "+PHONE+" and we'll send a new one.");
    if(data.error==="cancelled") return message("This estimate was updated","We changed the estimate after sending this link. Please use the newest link we texted you, or call "+PHONE+".");
    if(data.error) return message("Link not found","We couldn't find this estimate. Please call or text "+PHONE+".");

  const brandMark=(k,label)=>`<img class="blogo" src="${BRAND[k].img}" alt="${esc(BRAND[k].name)}" onload="this.parentNode.classList.add('has-logo')" onerror="this.remove()"><span class="bname">${esc(label)}</span>`;
  const M_LABEL={zelle:"Zelle",cash:"Cash",credit:"Credit card",debit:"Debit card",snap:"Snap Finance",affirm:"Affirm",other:"Other"};
  const r2=n=>Math.round((Number(n)||0)*100)/100;
  const fmtWhen=v=>{ if(!v) return ""; const d=new Date(typeof v==="number"?v:v); return isNaN(d)?String(v):d.toLocaleString([],{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); };
  const fmtDay=v=>{ if(!v) return ""; const d=new Date(/^\d{4}-\d\d-\d\d$/.test(v)?v+"T12:00":v); return isNaN(d)?String(v):`${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}/${d.getFullYear()}`; };
  let st=null, payAmt=null, payMethod="cashzelle", stTimer=null, justDecided="";
  const stepsHTML=status=>{ const cur=STEP_OF[status]??0; return `<section><div class="card" style="margin-top:14px">

      <div class="stepnames">${STEPS.map((x,i)=>`<span class="${i===cur?"cur":""}">${x[1]}</span>`).join("")}</div></div></section>`; };
  const paidOf=pays=>r2(pays.reduce((a,p)=>a+Number(p.amount||0)+Number(p.discount||0),0));

    ${(x.parts||[]).map(p=>`<div class="ln"><span>${esc(p.desc)}<small>Part \u00b7 qty ${esc(p.qty)}</small></span><span>${money(p.amount)}</span></div>`).join("")}

  async function printReceipt(d){
    let pa=$("#printArea"); if(!pa){ pa=document.createElement("div"); pa.id="printArea"; document.body.appendChild(pa); }
    pa.innerHTML=receiptHTML(d);
    // let the photos finish loading so they make it onto the PDF
    await Promise.all([...pa.querySelectorAll("img")].map(im=>im.complete?0:new Promise(r=>{ im.onload=im.onerror=r; setTimeout(r,5000); })));
    const old=document.title; document.title=`Citea Motors ${d.stage==="invoice"?"receipt":"estimate"} - ${((d.snapshot||{}).vehicle)||""}`.trim();

    // (the class only changes the printed page, never the screen)
    const done=()=>{ window.removeEventListener("afterprint",done); document.body.classList.remove("print-inv"); document.title=old; };
    document.body.classList.add("print-inv"); window.addEventListener("afterprint",done);
    window.print();

  function lightbox(urls, start, opt){

    const end=e=>{ if(x0==null) return; const w=stage.clientWidth||1, fast=Date.now()-t0<300&&Math.abs(dx)>30, dy=Math.abs((e.clientY||y0)-y0);
      x0=null; if((Math.abs(dx)>w*0.18||fast)&&Math.abs(dx)>dy) go(i+(dx<0?1:-1)); else if(Math.abs(dx)<6&&dy>80) close(); else paint(); };
    stage.addEventListener("pointerup",end); stage.addEventListener("pointercancel",end);
    paint(false); el.querySelector(".lb-x").focus();
    return {close};
  }
  // tapping a photo of your car opens a swipeable viewer instead of a new tab
  document.addEventListener("click",e=>{ const l=e.target.closest&&e.target.closest(".gal a"); if(!l||e.metaKey||e.ctrlKey) return;
    e.preventDefault(); const links=[...l.closest(".gal").querySelectorAll("a")]; lightbox(links.map(x=>x.getAttribute("href")), links.indexOf(l)); },true);
  const photosHTML=d=>(d.photos||[]).length?`<h2>Photos of your car</h2><section><div class="card"><div class="gal">${d.photos.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Photo of your vehicle" loading="lazy"></a>`).join("")}</div>
      <div class="hint" style="margin-top:8px">Taken at check-in. Tap a photo to see it full size.</div></div></section>`:"";
  const smsHTML=d=>`<section><div class="card smsbox"><label class="agree smsok" style="margin:0"><input type="checkbox" id="smsToggle" ${d.sms_ok?"checked":""}> Text me updates about this repair${(d.snapshot||{}).phone?" at "+esc(d.snapshot.phone):""}.</label>
      <div class="hint" style="margin:4px 0 0 30px" id="smsMsg">${d.sms_ok?"You're signed up for text updates.":"Optional. Msg &amp; data rates may apply. Reply STOP any time to stop."}</div></div></section>`;
  function statusHTML(d){
    const s=d.snapshot||{}, jobs=jobsOf(s), done=d.done_lines||{}, pays=d.payments||[];
    const total=r2(s.total||0), bal=Math.max(0,r2(total-paidOf(pays)));
    const lines=jobs.flatMap(x=>shownLabor(x).map(l=>({...l,job:x.title,jobKey:x.key}))), jw=d.job_work||{};
    // what the technician is doing on each job right now (started / working now)
    const workNote=l=>{ const w=jw[l.jobKey]; if(!w||!w.started) return "Not started yet"; return w.active?"Technician is working on this now":`Started ${esc(fmtWhen(Number(w.started)))} \u00b7 paused`; };
    const doneN=lines.filter(l=>l.id&&done[l.id]).length;
    const ap=d.approval, invoice=d.stage==="invoice", picked=d.status==="picked_up";
    const workHTML=lines.length?`<h2>Work ${invoice?"done":"being done"}</h2><section><div class="card">
        <div class="muted" style="font-size:13px">${doneN} of ${lines.length} done</div>
        <div class="meter"><i style="width:${lines.length?Math.round(doneN/lines.length*100):0}%"></i></div>
        ${lines.map(l=>{ const ok=l.id&&done[l.id], live=!ok&&jw[l.jobKey]&&jw[l.jobKey].active; return `<div class="task ${ok?"ok":""} ${live?"live":""}"><div class="tick">${ok?'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':""}</div>
          <div>${esc(l.desc)}<small>${ok?"Done":invoice?"Not done":workNote(l)}${jobs.length>1&&l.job!==l.desc?" \u00b7 "+esc(l.job):""}</small></div></div>`; }).join("")}
      </div></section>`:"";
    if(invoice) return `
      ${stepsHTML(d.status)}
      <div class="hello"><div class="eyebrow">${picked?"Picked up":"Ready for pickup"}</div><h1>${picked?"Thank you":"Your car is ready"}${s.first?", "+esc(s.first):""}</h1>
        <div class="muted" style="font-size:14px">${picked?"Here's your final invoice for your records.":`Your ${esc(s.vehicle||"vehicle")} is ready for pickup.${bal>0.004?" Your final invoice and payment options are below.":""}`}</div></div>
      ${bal>0.004?`<h2>Pay</h2>${payHTML(d,bal)}`:""}
      <h2>Final invoice</h2>
      <section><div class="card" style="padding:0;overflow:hidden">${invoiceHTML(d)}</div>
        <button class="btn ghost printbtn" id="printInv" type="button">Save receipt as PDF or print</button></section>
      ${bal<=0.004?payHTML(d,bal):""}
      ${preCardHTML(d)}${inspHTML(d)}
      ${photosHTML(d)}

      ${footer}`;
    // repair in progress (approved)
    return `
      ${stepsHTML(d.status)}
      <div class="hello"><div class="eyebrow">Your repair</div><h1>Hi ${esc(s.first||"there")}</h1>
        <div class="muted" style="font-size:14px">${esc(s.vehicle||"Your vehicle")}${s.vin?`<div class="mono" style="font-size:13px;margin-top:2px;letter-spacing:.04em;word-break:break-all">VIN ${esc(String(s.vin))}</div>`:""}</div></div>
      ${justDecided==="approved"?`<section><div class="card note">Thank you \u2014 we have your approval. You'll get a text when your car is ready.</div></section>`:""}
      <section><div class="card">
        <div class="now">${esc(d.status==="waiting_parts"?(d.wait_reason==="customer"?"Waiting on you \u2014 we'll reach out":d.wait_reason==="parts"?"Waiting for parts":"Your repair is in progress"):(NOW_TEXT[d.status]||"In the shop"))}</div>
        <div class="facts">
          <div><b>Repair started</b>${d.started_ms?esc(fmtWhen(Number(d.started_ms))):"Not started yet"}</div>
          ${ap?`<div><b>Approved</b>${esc(fmtWhen(ap.at))}${ap.signer?" by "+esc(ap.signer):""}</div>`:""}
        </div></div></section>
      ${workHTML}
      ${notesHTML(d)}${preCardHTML(d)}${inspHTML(d)}
      ${photosHTML(d)}
      <h2>Approved estimate</h2>
      <section><button class="btn ghost printbtn" id="printInv" type="button" style="margin-top:0">Save a copy as PDF or print</button></section>
      <section>${jobs.map(x=>`<div class="card job"><div class="job-top"><h3>${esc(x.title)}</h3>
          <div class="jt"><span>${x.tax?"Incl. tax":"Total"}</span><b>${money(x.total)}</b></div></div>
          <details open><summary>Parts &amp; labor</summary><div class="lines">${lineRows(x)}</div></details></div>`).join("")}
        <div class="card sum">
          ${s.whole_discount?`<div class="ln"><span>Discount</span><span>\u2212${money(s.whole_discount)}</span></div>`:""}
          <div class="ln"><span>Estimate total</span><span>${money(total)}</span></div>
          ${pays.map(p=>`<div class="ln"><span>${p.kind==="deposit"?"Deposit":"Payment"} \u00b7 ${esc(M_LABEL[p.method]||p.method)}<small>${esc(fmtWhen(p.at))}</small></span><span>\u2212${money(r2(Number(p.amount)+Number(p.discount||0)))}</span></div>`).join("")}
          <div class="ln tot"><span>Balance</span><span>${money(bal)}</span></div>
        </div></section>


      ${footer}`;
  }
  function renderHowTo(){
    const box=$("#howto"); if(!box||!st) return;
    const pay=st.pay||{}, s=st.snapshot||{}, pct=Number(pay.cash_discount_pct||0);
    const amt=r2(payAmt||0), off=payMethod==="cashzelle"&&pct?r2(amt*pct/100):0, due=r2(amt-off);
    const sumLines=amt?`${off?`<div class="ln"><span>Amount</span><span>${money(amt)}</span></div><div class="ln"><span>${pct}% cash / Zelle discount</span><span>\u2212${money(off)}</span></div>`:""}<div class="ln" style="font-weight:700"><span>You pay</span><span>${money(due)}</span></div>`:"";
    const memo=`${s.first||""} ${s.vehicle||""}`.trim();
    let how="";
    const zto=pay.zelle_to||SHOP_ZELLE;
    if(payMethod==="cashzelle") how=`<b>Cash:</b> pay in person when you pick up your vehicle.
      <div style="margin-top:10px"><b>Zelle:</b> send ${amt?money(due):"your payment"} to our phone number:</div><div class="copyrow"><code>${esc(zto)}</code><button type="button" id="cpZelle">Copy</button></div><div class="feenote">In the Zelle memo, put: <b>${esc(memo)}</b>. We'll mark it paid as soon as it arrives.</div>`;
    else if(payMethod==="card") how=`Pay with your debit or credit card in person when you pick up your vehicle.`;
    else if(payMethod==="snap") how=`Pay over time with Snap Finance.<a class="btn brand-btn b-snap" href="${esc(pay.snap_url||BRAND.snap.url)}" target="_blank" rel="noopener"><span class="pw">Pay with</span><span class="lchip">${brandMark("snap","Snap Finance")}</span></a>`;
    else if(payMethod==="affirm") how=`Pay over time with Affirm.<a class="btn brand-btn b-affirm" href="${esc(pay.affirm_url||BRAND.affirm.url)}" target="_blank" rel="noopener"><span class="pw">Pay with</span><span class="lchip">${brandMark("affirm","Affirm")}</span></a>`;
    box.innerHTML=(off&&sumLines?`<div class="card sum" style="margin:0 0 12px;padding:12px">${sumLines}</div>`:"")+how;   // only shown when a discount changes the amount
    const cp=$("#cpZelle"); if(cp) cp.onclick=async()=>{ try{ await navigator.clipboard.writeText(zto); cp.textContent="Copied"; }catch(e){} };
  }
  function bindStatus(){
    const sg=$("#smsToggle"); if(sg) sg.onchange=async()=>{ const m=$("#smsMsg"); sg.disabled=true;
      const {data,error}=await sb.rpc("set_text_updates",{p_token:statusToken,p_ok:sg.checked}); sg.disabled=false;
      if(error||!data||data.error){ sg.checked=!sg.checked; if(m) m.textContent="Couldn't save that. Please try again."; return; }
      st.sms_ok=sg.checked; if(m) m.textContent=sg.checked?"You're signed up for text updates.":"Text updates are off."; };
    const pr=$("#printInv"); if(pr) pr.onclick=()=>printReceipt(st);
    const amtIn=$("#payAmt"); if(!amtIn) return;
    const bal=Math.max(0,r2(Number((st.snapshot||{}).total||0)-paidOf(st.payments||[])));
    if(payAmt==null||payAmt>bal+0.004) payAmt=bal;
    amtIn.value=payAmt?payAmt.toFixed(2):"";
    const markAmt=()=>document.querySelectorAll("[data-amt]").forEach(b=>b.classList.toggle("on",b.dataset.amt!==""?Math.abs(Number(b.dataset.amt)-payAmt)<0.005:Math.abs(bal-payAmt)>=0.005));
    markAmt();
    document.querySelectorAll("[data-amt]").forEach(b=>b.onclick=()=>{ if(b.dataset.amt===""){ amtIn.value=""; payAmt=0; markAmt(); renderHowTo(); amtIn.focus(); return; } payAmt=Number(b.dataset.amt); amtIn.value=payAmt.toFixed(2); markAmt(); renderHowTo(); });
    amtIn.oninput=()=>{ payAmt=Math.max(0,Number(String(amtIn.value).replace(/[^0-9.]/g,""))||0); markAmt(); renderHowTo(); };
    document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ payMethod=b.dataset.m; document.querySelectorAll("[data-m]").forEach(x=>x.classList.toggle("on",x===b)); renderHowTo(); });
    renderHowTo();
  }
  let lastShown="";
  async function loadStatus(quiet){
    const {data,error}=await sb.rpc("get_work_status",{p_token:statusToken});
    if(error||!data){ if(!quiet) message("Can't load your repair","Please check your internet connection and try again, or call "+PHONE+"."); return; }
    if(data.error) return message("Link not found","We couldn't find this repair. Please use the full link from your text message, or call or text "+PHONE+".");
    const busy=document.activeElement&&["payAmt","name"].includes(document.activeElement.id);
    if(quiet&&(busy||(data.stage==="estimate"&&lastShown===data.stage+data.doc_hash))) { clearTimeout(stTimer); stTimer=setTimeout(()=>loadStatus(true),60000); return; }
    st=data; lastShown=data.stage+data.doc_hash;
    if(data.stage==="estimate"){
      document.title="Your estimate \u2013 Citea Motors";
      const ld=data.last_decision;
      const note= ld&&ld.status==="approved" ? `We updated your estimate since you approved ${money(ld.total)}. Please review the new total and approve it below.`
        : ld&&ld.status==="declined" ? `You declined this estimate ${esc(fmtWhen(ld.at))}. If you change your mind, you can still approve it below.` : "";
      render(data.snapshot, data.doc_hash, {token:statusToken, note, updated:!!(ld&&ld.status==="approved"), smsOk:!!data.sms_ok});
    } else {
      document.title=(data.stage==="invoice"?"Your invoice":"Your repair")+" \u2013 Citea Motors";
      const y=window.scrollY; $("#main").innerHTML=statusHTML(data); $("#cta").classList.add("hidden"); bindStatus(); if(quiet) window.scrollTo(0,y);
      // opened from the team portal's "Print receipt": print once, then drop the flag so a reload doesn't print again
      if(autoPrint){ autoPrint=false; try{ history.replaceState(null,"",location.pathname+location.search+"#w="+statusToken); }catch(e){} setTimeout(()=>printReceipt(data),500); }
    }
    clearTimeout(stTimer); stTimer=setTimeout(()=>loadStatus(true),60000);
  }
  document.addEventListener("visibilitychange",()=>{ if(statusToken&&document.visibilityState==="visible") loadStatus(true); });
  if(statusToken) loadStatus(); else load();
})();
</script>
</body>
</html>
