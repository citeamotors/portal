<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>(function(){try{var m=localStorage.getItem("citea-theme")||"light";var d=m==="dark"||(m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");}catch(e){}})();</script>
<title>Citea Motors Team Portal</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Citea Motors brand: black / white / gray, Signal Red as the only accent, Montserrat + JetBrains Mono, square corners.
     Layout modeled on modern shop software: dark sidebar, light work area, job board columns, repair order with totals rail. */
  :root{
    --ink:#111111; --graphite:#3D3D3D; --steel:#686868; --hairline:#DADAD7;
    --paper:#F5F5F3; --surface:#FFFFFF; --black:#000000; --sub:#EDEDEA;
    --red:#C8201F; --red-dk:#A51A19; --red-tint:#FBEAEA; --green:#1E7F4F; --green-tint:#E6F2EC;
    --side:232px; --top:60px; --accent2:#C8201F; --text:#111111; --on-ink:#FFFFFF; --grid:#F0F0EE;
    color-scheme:light;
    --sans:"Montserrat","Helvetica Neue",Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--sans);margin:0;letter-spacing:0}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .hidden{display:none!important}
  .mono,.num,td.num,input.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* ---------- login ---------- */
  #login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,1fr)}
  .login-hero{background:var(--black);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:48px;position:relative}
  .login-hero::after{content:"";position:absolute;left:48px;right:48px;bottom:118px;height:10px;background:#fff}
  .login-hero img{width:260px;max-width:70%}
  .login-hero .tag{font-weight:300;letter-spacing:.42em;text-transform:uppercase;font-size:13px;color:#C8C8C6;margin-top:28px}
  .services{display:flex;align-items:center;gap:0;font-weight:600;letter-spacing:.28em;font-size:12px;text-transform:uppercase}
  .services span,.services a{padding:0 14px;border-left:1px solid currentColor;line-height:1;color:inherit;text-decoration:none}
  .services span:first-child,.services a:first-child{padding-left:0;border-left:0}
  .services a:hover{text-decoration:underline;text-underline-offset:4px}
  .login-side{display:grid;place-items:center;padding:32px 24px;background:var(--paper)}
  .login-card{width:100%;max-width:380px}
  .login-card h1{font-size:26px;font-weight:300;letter-spacing:.3em;text-transform:uppercase}
  .login-card .sub{color:var(--steel);margin:6px 0 22px;font-size:13px}
  @media (max-width:820px){ #login{grid-template-columns:1fr} .login-hero{padding:28px;min-height:220px} .login-hero::after{display:none} }

  label{display:block;font-size:11px;font-weight:600;color:var(--steel);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.1em}
  input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--hairline);border-radius:2px;padding:9px 11px;outline:none;font-size:14px}
  input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  input::placeholder,textarea::placeholder{color:#9A9A98}
  .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px;font-weight:500}
  .demo-note{margin-top:20px;padding:12px 14px;background:var(--surface);border:1px solid var(--hairline);border-left:0;font-size:12.5px;color:var(--steel);position:relative}
  .demo-note b{color:var(--ink)}
  .hint{font-size:12px;color:var(--steel);margin-top:5px}
  .muted{color:var(--steel)}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--red);color:#fff;border:1px solid var(--red);border-radius:0;padding:9px 16px;font-weight:600;font-size:13.5px;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--red-dk);border-color:var(--red-dk)}
  .btn.dark{background:var(--ink);border-color:var(--ink);color:var(--on-ink)} .btn.dark:hover{background:#333}
  .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--hairline)}
  .btn.ghost:hover{border-color:var(--ink);background:var(--surface)}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .btn.block{width:100%;margin-top:20px;padding:12px}
  .btn.start{background:#1E6FD9;border-color:#1E6FD9;color:#fff} .btn.start:hover{background:#1859B0}
  .btn.pause{background:var(--red);color:#fff;border-color:var(--red)} .btn.pause:hover{background:var(--red-dk)}
  .btn.complete{background:var(--green);border-color:var(--green);color:#fff} .btn.complete:hover{filter:brightness(.92)}
  .btn.finish{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
  .linkbtn{background:none;border:0;color:var(--red);padding:0;font-size:12px;font-weight:600;text-decoration:underline}
  .x{background:none;border:0;color:#9A9A98;font-size:20px;line-height:1;padding:6px}
  .x:hover{color:var(--red)}

  /* ---------- app shell ---------- */
  #app{min-height:100vh}
  .sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--black);color:#fff;display:flex;flex-direction:column;z-index:10}
  .side-logo{padding:28px 26px 24px;border-bottom:1px solid #222;text-align:center}
  .side-logo img{width:180px;display:block;margin:0 auto}
  .side-logo img{cursor:pointer}
  .nav{padding:12px 0;flex:1;overflow-y:auto}
  .nav .sect{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8A8A88;padding:14px 20px 6px}
  .nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:#C8C8C6;padding:10px 20px;font-size:13.5px;font-weight:500;text-align:left;border-left:3px solid transparent}
  .nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
  .nav button:hover{color:#fff;background:#111}
  .nav button.on{color:#fff;background:#1A1A1A;border-left-color:var(--red)}
  .nav .count{margin-left:auto;font-family:var(--mono);font-size:11px;background:#262626;color:#fff;padding:1px 7px}
  .side-foot{border-top:1px solid #222;padding:14px 20px}
  .side-user{display:flex;align-items:center;gap:10px}
  .avatar{width:32px;height:32px;flex:none;background:#fff;color:#000;display:grid;place-items:center;font-weight:700;font-size:13px}
  .side-user b{display:block;font-size:13px} .side-user small{color:#8A8A88;font-size:11.5px}
  .side-foot .services{color:#8A8A88;font-size:9.5px;letter-spacing:.22em;margin-top:14px}
  .side-foot .services span{padding:0 9px}
  .side-foot .services span:first-child{padding-left:0}

  .main{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:35;height:var(--top);background:var(--surface);border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:14px;padding:0 24px}
  .topbar h1{font-size:18px;font-weight:600;white-space:nowrap}
  .gsearch{position:relative;flex:1;max-width:460px;margin-left:12px}
  .gsearch input{padding-left:34px;background:var(--paper);border-color:var(--paper)}
  .gsearch input:focus{background:var(--surface)}
  .gsearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--steel);fill:none;stroke-width:2}
  .gresults{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--ink);max-height:380px;overflow:auto;z-index:20}
  .gresults .gr{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--hairline);padding:9px 12px;font-size:13px}
  .gresults .gr:hover{background:var(--paper)}
  .gresults .gr small{display:block;color:var(--steel);font-size:12px}
  .gresults .gh{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);padding:8px 12px 4px;background:var(--paper)}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .clockpill{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:6px 10px;border:1px solid var(--hairline);background:var(--surface)}
  .clockpill i{width:8px;height:8px;background:var(--steel);display:inline-block}
  .clockpill.on{border-color:var(--green);color:var(--green)} .clockpill.on i{background:var(--green)}
  .clockpill .ps{display:none}
  main#view{padding:24px;max-width:1440px;width:100%}
  .v-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;width:56px;height:56px;border-radius:50%;background:var(--black);border:2px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.35);display:grid;place-items:center;cursor:pointer;padding:0}
  .v-fab svg,.v-mic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
  body.wo-open .v-fab{bottom:calc(84px + env(safe-area-inset-bottom))}
  @media (min-width:901px){ .v-fab,body.wo-open .v-fab{right:24px;bottom:24px} }
  .v-panel{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:31;width:min(420px,calc(100vw - 32px));max-height:55vh;overflow:auto;background:var(--surface,#fff);color:var(--ink);border:1px solid var(--hairline,#ddd);border-top:6px solid var(--black);box-shadow:0 10px 30px rgba(0,0,0,.3);padding:12px 14px}
  body.wo-open .v-panel{bottom:calc(152px + env(safe-area-inset-bottom))}
  @media (min-width:901px){ .v-panel,body.wo-open .v-panel{bottom:92px;right:24px} }
  .v-head{display:flex;align-items:center;gap:10px}.v-head b{font-size:12px;letter-spacing:.2em;text-transform:uppercase}
  .v-heard{font-size:15px;margin:10px 0;min-height:22px;color:var(--ink)}
  .v-row{display:flex;gap:10px;align-items:center}
  .v-mic{flex:none;width:52px;height:52px;border-radius:50%;background:var(--black);border:0;display:grid;place-items:center;cursor:pointer}
  .v-panel.listening .v-mic{background:var(--red,#C8201F);animation:vpulse 1.2s infinite}
  @keyframes vpulse{0%{box-shadow:0 0 0 0 rgba(200,32,31,.5)}100%{box-shadow:0 0 0 14px rgba(200,32,31,0)}}
  .v-form{flex:1;display:flex;gap:6px;min-width:0}.v-form input{flex:1;min-width:0;margin:0}
  .v-log{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .v-line{font-size:13.5px;line-height:1.35;padding:6px 8px;border-left:3px solid #2E7D32;background:rgba(46,125,50,.07)}
  .v-line.no{border-left-color:var(--red,#C8201F);background:rgba(200,32,31,.07)}
  .v-help{margin-top:12px;border-top:1px solid var(--hairline,#ddd);padding-top:10px;display:flex;flex-direction:column;gap:8px;font-size:13px}
  .v-help b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase}.v-help span{color:var(--steel,#666)}
  @media print{.v-fab,.v-panel{display:none!important}}
  @media (max-width:900px){
    #topNew{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;width:56px;height:56px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.35);display:grid;place-items:center}
    #topNew.hidden{display:none}
    #topNew span:first-child{font-size:30px!important;font-weight:300;line-height:1;margin-top:-3px}
    #topNew .lbl{display:none}
    body.wo-open #topNew{bottom:calc(84px + env(safe-area-inset-bottom))}
    #app.nav-open #topNew{display:none}
    main#view{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  }
  .scanbig{width:100%;min-height:58px;font-size:17px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 10px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .scanbig svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
  .scan2{margin-top:0}
  .mtabs{display:none}
  @media (max-width:700px){
    .mtabs{display:flex;gap:0;margin:0 0 12px;border:1px solid var(--hairline);background:var(--surface);position:sticky;top:var(--topbar-h,60px);z-index:4}
    .mtabs button{flex:1;min-width:0;padding:11px 4px 9px;border:0;border-right:1px solid var(--hairline);background:transparent;font:600 12.5px var(--sans);color:var(--steel);display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:3px solid transparent;cursor:pointer}
    .mtabs button:last-child{border-right:0}
    .mtabs button span{font:700 15px var(--mono);color:var(--ink)}
    .mtabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
    .mtabs button.est.on{border-bottom-color:var(--steel)} .mtabs button.done.on{border-bottom-color:var(--green,#2E7D32)}
    .kanban.mtab{display:block}
    .kanban.mtab>.kcol:not(.mshow){display:none}
    .kanban.mtab>.kcol>.khead{display:none}
  }
  .jobs-card .jblk{border:1px solid var(--hairline);padding:12px 12px 10px;margin:0 0 12px;background:var(--surface)}
  .jobs-card .jblk.blank{border-style:dashed}
  .jobs-card .jblk.declined{opacity:.65}
  .jtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;min-height:24px}
  .jtop .jn{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
  .jdesc{position:relative}
  .jdesc input{width:100%;padding-right:40px}
  .jdesc .jx{position:absolute;top:50%;right:4px;transform:translateY(-50%)}
  .jtop .jx{position:static;transform:none}
  .jnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(88px,auto);gap:8px;align-items:end;margin-top:8px}
  .jnums.c4{grid-template-columns:repeat(3,minmax(0,1fr)) minmax(88px,auto)}
  .jnums:not(.c4):not(.l4){grid-template-columns:repeat(2,minmax(0,1fr)) minmax(88px,auto)}
  .jnums label{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--text);min-width:0}
  .jnums input,.jnums select{width:100%;min-width:0;margin-top:4px}
  .jamt{text-align:right;min-width:0;padding-bottom:9px}
  .jamt span{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text);font-weight:700}
  .jamt b{font-size:15px;white-space:nowrap}
  .txtok{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:14px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--text)}
  .txtok input{width:auto;margin:0}
  /* red until the customer OKs texts, green once they do (never required to save) */
  .txtok{padding:8px 12px;border:1.5px solid #C8201F;background:rgba(200,32,31,.08);color:#C8201F;cursor:pointer;width:fit-content}
  .txtok input{accent-color:#16a34a}
  .txtok.on{border-color:#16a34a;background:rgba(22,163,74,.10);color:#15803d}
  [hidden]{display:none!important}
  .wo-no{font-weight:600}
  #cName,#cPhone,#cEmail{-webkit-appearance:none;appearance:none}
  #cName::-webkit-search-cancel-button,#cPhone::-webkit-search-cancel-button,#cEmail::-webkit-search-cancel-button,#cName::-webkit-search-decoration{-webkit-appearance:none;display:none}
  .cust-ro .ro-val{padding:9px 11px;border:1px solid var(--hairline);font-size:15px;line-height:1.35;overflow-wrap:anywhere;word-break:break-word;min-height:40px}
  .pu h2{margin-bottom:10px} .pu-car{display:flex;flex-direction:column;gap:2px;font-size:15px;margin-bottom:10px} .pu-car .mono{font-size:12.5px;color:var(--steel)}
  .pu-tot{display:flex;justify-content:space-between;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);padding:10px 0;font-size:16px}
  .pu-bal{margin-top:10px;padding:10px 12px;border:1.5px solid var(--red);color:var(--red);font-size:14px} .pu-paid{margin-top:10px;color:var(--green);font-weight:600}
  .pu-terms{margin-top:12px;font-size:13px;line-height:1.5;color:var(--steel)} .pu-terms .tlink{color:#1d6fd6;text-decoration:underline}
  .pu-agree{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600}
  .pu-agree input{width:22px;height:22px;margin:0;flex:none}
  .pu-pad{display:block;width:100%;height:190px;background:#fff;border:1.5px dashed var(--steel);touch-action:none;cursor:crosshair}
  .pickup-rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;padding:10px 12px;border:1px solid var(--hairline);background:transparent;color:var(--ink);font:inherit;font-size:14px;text-align:left;cursor:pointer}
  .pickup-rec .muted{margin-left:auto;text-decoration:underline}
  .role-list{display:flex;flex-direction:column;gap:8px}
  .role-row{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--hairline);background:transparent;color:var(--ink);cursor:pointer;font:inherit}
  .role-row:hover{border-color:var(--ink)} .role-row .muted{font-size:12.5px}
  .perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px} .perm-grid.one{grid-template-columns:1fr}
  .perm{display:flex;align-items:center;gap:8px;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);margin:4px 0;font-weight:500}
  .perm input{width:auto;margin:0}
  @media(max-width:520px){.perm-grid{grid-template-columns:1fr}}
  .stale-note{color:var(--text);font-weight:600} html[data-theme="dark"] .stale-note{color:#fff}
  .txtok.nudge{animation:txtNudge .5s ease 2}
  @keyframes txtNudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  html[data-theme="dark"] .txtok{color:#ff6b6b;background:rgba(200,32,31,.16)} html[data-theme="dark"] .txtok.on{color:#22c55e;background:rgba(22,163,74,.16)}
  .wo-auto{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--steel);margin:0 0 2px}
  .wo-auto i{width:9px;height:9px;background:var(--green);flex:none}
  .wo-auto.busy i{background:var(--steel)} .wo-auto.bad i{background:var(--red)} .wo-auto.bad{color:var(--red)}
  .m-auto{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
  .m-auto.busy{color:var(--steel)} .m-auto.bad{color:var(--red)}
  .qbo-box{margin-top:14px;padding-top:12px;border-top:1px dashed var(--hairline)}
  .sq-btn{width:100%;margin-top:12px;padding:12px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;white-space:normal;text-align:center;line-height:1.25;height:auto;min-height:56px}
  .sq-btn span{font-size:15px} .sq-btn b{font-size:17px;font-weight:700}
  .gp-amt{display:flex;flex-direction:column;align-items:center;padding:14px;margin:4px 0 12px;background:var(--sub)}
  .gp-amt span{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
  .gp-amt b{font-size:30px;font-weight:700;margin:2px 0}
  .gp-amt small{font-size:12.5px;color:var(--steel)}
  .gp-steps{margin:0 0 10px;padding-left:20px;font-size:15px;line-height:1.7}
  .jsub{margin:14px 0 2px;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text);border-top:1px solid var(--hairline);padding-top:10px}
  .jrow{margin-top:8px}.jrow+.jrow{border-top:1px dashed var(--hairline);padding-top:8px}
  .jrow.blank .jnums input,.jrow.blank .jnums select,.jrow.blank .jamt b{opacity:.55}
  .jinv{width:100%;margin-top:8px;font-size:13px}
  .jtot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);margin-top:12px;padding-top:8px;font-weight:600}
  .jtot b{font-size:16px}
  .jwhole .jsub{display:none}
  @media (max-width:520px){
    .jnums,.jnums.c4,.jnums.l4{grid-template-columns:repeat(3,minmax(0,1fr))}

  @media (max-width:420px){ .inv-bars{grid-template-columns:1fr 1fr} .inv-bars>div:last-child{grid-column:1/-1} .inv-cols{grid-template-columns:44px 1fr 56px 70px}.inv-cols .pn,.inv-cols .sl,.inv-job .pn,.inv-job .sl{display:none} }

    html,body.print-inv{background:#fff!important}
    body.print-inv>*:not(#printArea){display:none!important}
    body.print-inv #printArea{display:block!important}
    body.print-inv #printArea .inv{padding:0}
    body.print-inv .inv-cols{grid-template-columns:52px 1fr 92px 62px 70px 78px} body.print-inv .inv-cols .pn,body.print-inv .inv-cols .sl{display:block} body.print-inv .inv-job .pn,body.print-inv .inv-job .sl{display:table-cell} body.print-inv .inv-job col.pn,body.print-inv .inv-job col.sl{display:table-column}
    body.print-inv .inv-job{break-inside:avoid} body.print-inv .inv-fine,body.print-inv .inv-sign,body.print-inv .inv-close{break-inside:avoid}
    body.print-inv .inv-bars{grid-template-columns:1fr 1fr 1fr}
    @page{margin:12mm}
  }
  /* RECEIPT-CSS-END */
</style>

  (function(){

      sx=t.clientX; sy=t.clientY; w=side.offsetWidth||280;

      if(!mode) return;
      const t=e.touches[0], mx=t.clientX-sx, my=t.clientY-sy;

        decided=true; side.style.transition="none";

      if(!mode || !decided){ mode=null; return; }

      if(mode==="open" && dx>w*0.3) app.classList.add("nav-open");

  /* ---------- time clock ---------- */

  const PAY_TYPES=[["hourly","Hourly"],["hourly_flag","Hourly + flag rate"],["flag","Flag rate only"]];
  const payOf=uid=>(db.pay||{})[uid]||null;
  // flag hours: each repair job's tech hours, credited when the work order is finished (ready for pickup or picked up).
  // Split between techs by the time each one ran on that job; with no time logged, the lead technician gets it.
  function flagJobs(uid, from, to){
    const out=[];
    for(const j of db.jobs){
      if(!isWO(j)||!(j.status==="completed"||j.status==="picked_up")||!j.completedAt||j.completedAt<from||j.completedAt>=to) continue;
      const crew=crewIds(j); if(!crew.includes(uid)&&!db.jobTime.some(s=>s.jobId===j.id&&s.userId===uid)) continue;
      for(const l of j.labor||[]){
        if(l[5]||!String(l[0]||"").trim()) continue;
        const hrs=techHrsOf(l); if(!(hrs>0)) continue;
        const key=l[6]&&(j.labor||[]).some(p=>p[4]===l[6])?l[6]:l[4];
        let segs=db.jobTime.filter(s=>s.jobId===j.id&&s.lineKey===key&&s.end); if(!segs.length) segs=db.jobTime.filter(s=>s.jobId===j.id&&!s.lineKey&&s.end);
        const tot=segs.reduce((s,x)=>s+(x.end-x.start),0), mine=segs.filter(s=>s.userId===uid).reduce((s,x)=>s+(x.end-x.start),0);
        const share=tot>0?mine/tot:(j.assignee?(j.assignee===uid?1:0):(crew.length===1&&crew[0]===uid?1:0));
        if(share>0) out.push({j,desc:String(l[0]),hrs:Math.round(hrs*share*100)/100,share});
      }
    }
    return out;
  }
  function payFor(uid, from, to){

    const flagHrs=Math.round(jobs.reduce((s,x)=>s+x.hrs,0)*100)/100;
    const hourly=type==="hourly"||type==="hourly_flag"?r2(hours*hr):0, flag=type==="hourly_flag"||type==="flag"?r2(flagHrs*fr):0;
    return {set:!!p,type,hr,fr,hours,flagHrs,jobs,hourly,flag,total:r2(hourly+flag)};
  }

    const [jobs,parts,time,st]=await Promise.all([fetchAll("body_jobs"),fetchAll("body_parts"),fetchAll("body_time"),sb.from("shop_settings").select("body_rates,tax").eq("id",1).maybeSingle()]);
    bdb={jobs:jobs.sort((a,b)=>b.number-a.number),parts,time,rates:(st.data&&st.data.body_rates)||null,tax:Number((st.data&&st.data.tax)??0.08375)};

  function bTotals(j){
    const r=j.rates||bdb.rates||{}, L=j.estimate||[], s=k=>L.reduce((a,x)=>a+bNumv(x[k])*(k==="part"?Math.max(bNumv(x.qty)||1,0):1),0);
    const h={body:s("body"),refn:s("refn"),frame:s("frame"),mech:s("mech")};
    const parts=s("part"), sublet=s("sublet");
    const labor={body:h.body*bNumv(r.body),refn:h.refn*bNumv(r.refinish),frame:h.frame*bNumv(r.frame),mech:h.mech*bNumv(r.mech)};
    const materials=h.refn*bNumv(r.materials);
    const laborT=labor.body+labor.refn+labor.frame+labor.mech;
    const tax=Math.round((parts+materials)*(bdb.tax||0)*100)/100;
    const total=Math.round((parts+materials+laborT+sublet+tax)*100)/100;
    const ded=j.payer==="customer"?0:Math.min(bNumv(j.deductible),total);
    return {h,parts,sublet,labor,laborT,materials,tax,total,ded,ins:j.payer==="customer"?0:total-ded,cust:j.payer==="customer"?total:ded,ratesSet:["body","refinish"].every(k=>bNumv(r[k])>0)};
  }

  function viewTimesheets(){
    const ws = viewTimesheets.ws || payWeekStart();
    const days=[...Array(7)].map((_,i)=>{ const d=new Date(ws); d.setDate(d.getDate()+i); return d; });
    const techs=db.users.filter(u=>u.dbRole!=="owner"||days.some(d=>msInRange(u.id,d.getTime(),d.getTime()+86400000)>0));
    const rows=techs.map(u=>{
      const per=days.map(d=>{ const a=d.getTime(), b=a+86400000; return msInRange(u.id,a,b); });
      const total=per.reduce((s,x)=>s+x,0);
      const bill=days.map(d=>{ const a=d.getTime(), b=a+86400000; return jobMsInRange(u.id,a,b); });
      const btotal=bill.reduce((s,x)=>s+x,0);
      return {u,per,total,ot:Math.max(0,total-40*3600000),bill,btotal};
    });
    const wsMs=ws.getTime(), weMs=wsMs+7*86400000;
    const worked=[]; // per job+tech this week
    for(const s of db.jobTime){ const a=Math.max(s.start,wsMs), b=Math.min(s.end||Date.now(),weMs); if(b<=a) continue;
      const k=s.jobId+"|"+s.userId; let w=worked.find(x=>x.k===k); if(!w){ w={k,job:s.jobId===CLEAN_ID?CLEAN_JOB:db.jobs.find(j=>j.id===s.jobId),userId:s.userId,ms:0,run:false}; worked.push(w); }

  function toLocalInput(ms){ if(!ms) return ""; const d=new Date(ms); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
  // managers clock a team member in or out for them (forgot to punch); the time can be set back
  function manualPunch(u){
    if(!u) return; const open=openPunch(u.id), now=Date.now();
    modal(`<h2>${open?"Clock out":"Clock in"} ${esc(u.name)}</h2>
      <p class="muted" style="margin-top:0">${open?`On the clock since ${esc(new Date(open.in).toLocaleString([],{weekday:"short",hour:"numeric",minute:"2-digit"}))}.`:"Not on the clock."} Set the time they actually ${open?"stopped":"started"}.</p>
      <label>${open?"Clock-out time":"Clock-in time"}</label><input id="mpT" type="datetime-local" value="${toLocalInput(now)}">
      <label>Reason</label><input id="mpWhy" placeholder="e.g. forgot to clock ${open?"out":"in"}" maxlength="200">
      <div class="err" id="mpErr"></div>
      <div class="row end"><button class="btn ghost" data-close type="button">Cancel</button><button class="btn" id="mpSave" type="button">${open?"Clock out":"Clock in"}</button></div>`, root=>{
      root.querySelector("#mpSave").onclick=()=>{
        const v=root.querySelector("#mpT").value, ms=v?new Date(v).getTime():NaN, er=root.querySelector("#mpErr");
        if(isNaN(ms)) return er.textContent="Pick a time.";
        if(ms>Date.now()+60000) return er.textContent="That time is in the future.";
        const mark={by:me.id,at:Date.now()}, edit={reason:root.querySelector("#mpWhy").value.trim()||("Forgot to clock "+(open?"out":"in")),by:me.id,at:Date.now()};
        if(open){ if(ms<=open.in) return er.textContent="Clock out has to be after they clocked in ("+fmtTime(open.in)+")."; open.out=ms; open.geo={...(open.geo||{}),manualOut:mark,edit}; const s=stopTask(u.id); if(s) s.end=ms; }
        else { if(db.punches.some(p=>p.userId===u.id&&p.in<=ms&&(p.out||Date.now())>ms)) return er.textContent="They already have a punch covering that time."; db.punches.push({id:uid(),userId:u.id,in:ms,out:null,geo:{manualIn:mark,edit}}); }
        save(); closeModal(); show(tab); toast(`${u.name} clocked ${open?"out":"in"} at ${fmtTime(ms)}`);
      };
    });
  }
  // edit one person's punches for one day (owners and managers); every change is logged with the reason
  function dayPunches(u, day){
    if(!u) return; const d0=new Date(day); d0.setHours(0,0,0,0); const d1=d0.getTime()+86400000;
    const list=db.punches.filter(p=>p.userId===u.id&&p.in<d1&&(p.out||Date.now())>d0.getTime()).sort((a,b)=>a.in-b.in).map(p=>({...p,_orig:p}));
    const dayIso=toLocalInput(d0.getTime()).slice(0,10);
    const row=(p,i)=>`<div class="dp-row" data-i="${i}"><div><label>In</label><input type="datetime-local" data-k="in" value="${toLocalInput(p.in)}"></div><div><label>Out</label><input type="datetime-local" data-k="out" value="${toLocalInput(p.out)}"></div><button class="x" type="button" data-rm="${i}" title="Remove this punch">\u00d7</button></div>`;
    const draw=root=>{ root.querySelector("#dpList").innerHTML=list.length?list.map((p,i)=>p._del?"":row(p,i)).join(""):'<div class="empty" style="padding:10px 0">No punches this day.</div>';
      root.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ pull(root); list[+b.dataset.rm]._del=true; draw(root); }); };
    const pull=root=>root.querySelectorAll(".dp-row").forEach(r=>{ const p=list[+r.dataset.i]; r.querySelectorAll("input").forEach(inp=>{ const v=inp.value; p[inp.dataset.k]=v?new Date(v).getTime():null; }); });
    modal(`<h2>${esc(u.name)} \u00b7 ${esc(d0.toLocaleDateString([],{weekday:"long",month:"short",day:"numeric"}))}</h2>
      <div id="dpList"></div>
      <button class="btn ghost sm" id="dpAdd" type="button" style="margin-top:8px">+ Add a punch</button>
      <label>Reason for the change</label><input id="dpWhy" placeholder="e.g. forgot to clock out" maxlength="200">
      <div class="hint">Every change is saved to the edit log.</div>
      <div class="err" id="dpErr"></div>
      <div class="row end"><button class="btn ghost" data-close type="button">Cancel</button><button class="btn" id="dpSave" type="button">Save</button></div>`, root=>{
      draw(root);
      root.querySelector("#dpAdd").onclick=()=>{ pull(root); const s=new Date(dayIso+"T08:00").getTime(); list.push({id:uid(),userId:u.id,in:s,out:s+8*3600000,_new:true}); draw(root); };
      root.querySelector("#dpSave").onclick=()=>{
        pull(root); const er=root.querySelector("#dpErr"), why=root.querySelector("#dpWhy").value.trim();
        const keep=list.filter(p=>!p._del);
        for(const p of keep){ if(!p.in) return er.textContent="Every punch needs a clock-in time."; if(p.out&&p.out<=p.in) return er.textContent="Clock out has to be after clock in."; if(p.in>Date.now()+60000||(p.out&&p.out>Date.now()+60000)) return er.textContent="Times can't be in the future."; }
        const srt=[...keep].sort((a,b)=>a.in-b.in); for(let i=1;i<srt.length;i++){ if(!srt[i-1].out||srt[i-1].out>srt[i].in) return er.textContent="Two punches overlap."; }
        const changed=list.filter(p=>p._del||p._new||p._orig.in!==p.in||(p._orig.out||null)!==(p.out||null));
        if(!changed.length){ closeModal(); return; }
        if(!why) return er.textContent="Add a short reason for the change.";
        const mark={reason:why,by:me.id,at:Date.now()};
        for(const p of changed){
          if(p._del){ if(!p._new) db.punches=db.punches.filter(q=>q.id!==p.id); continue; }
          if(p._new){ db.punches.push({id:p.id,userId:u.id,in:p.in,out:p.out,geo:{manualIn:{by:me.id,at:Date.now()},edit:mark}}); continue; }
          Object.assign(p._orig,{in:p.in,out:p.out,geo:{...(p._orig.geo||{}),edit:mark}});
        }
        save(); closeModal(); show(tab); toast("Punches saved");
      };
    });
  }
  function punchModal(p){
    const x = p || {id:uid(),userId:db.users[1]?db.users[1].id:db.users[0].id,in:null,out:null};
    modal(`<h2>${p?"Fix punch":"Add missed punch"}</h2>
      <label>Team member</label><select id="pU">${db.users.map(u=>`<option value="${u.id}" ${u.id===x.userId?"selected":""}>${esc(u.name)}</option>`).join("")}</select>
      <label>Clock in</label><input id="pI" type="datetime-local" value="${toLocalInput(x.in)}">
      <label>Clock out</label><input id="pO" type="datetime-local" value="${toLocalInput(x.out)}">
      <label>Reason</label><input id="pWhy" placeholder="e.g. forgot to clock in" maxlength="200">
      <div class="err" id="pErr"></div>
      <div class="row end">${p?'<button class="btn ghost" id="pDel">Delete</button><span class="spacer"></span>':""}<button class="btn ghost" data-close>Cancel</button><button class="btn" id="pSave">Save</button></div>`,
      root=>{
        root.querySelector("#pSave").onclick=()=>{
          const i=root.querySelector("#pI").value, o=root.querySelector("#pO").value;
          if(!i){ root.querySelector("#pErr").textContent="Enter a clock-in time."; return; }
          const inMs=new Date(i).getTime(), outMs=o?new Date(o).getTime():null;
          if(outMs && outMs<=inMs){ root.querySelector("#pErr").textContent="Clock out must be after clock in."; return; }
          const why=root.querySelector("#pWhy").value.trim(); if(!why){ root.querySelector("#pErr").textContent="Add a short reason for the change."; return; }
          Object.assign(x,{userId:root.querySelector("#pU").value,in:inMs,out:outMs,geo:{...(x.geo||{}),edit:{reason:why,by:me.id,at:Date.now()}}});
          if(!p){ x.geo.manualIn={by:me.id,at:Date.now()}; db.punches.push(x); } save(); closeModal(); show(tab); toast("Punch saved");
        };
        const d=root.querySelector("#pDel"); if(d) d.onclick=()=>{ if(!confirm("Delete this punch? It stays in the edit log.")) return; db.punches=db.punches.filter(q=>q.id!==x.id); save(); closeModal(); show(tab); };
      });
  }

  /* ---------- team ---------- */
  /* ---------- reports (managers see operations; money sections owners only) ---------- */
  function reportRange(key){
    const now=new Date(), ws=weekStart(now), lws=new Date(ws); lws.setDate(lws.getDate()-7);
    const mo=new Date(now.getFullYear(),now.getMonth(),1), pmo=new Date(now.getFullYear(),now.getMonth()-1,1);
    const R={
      week:{from:ws,to:new Date(ws.getTime()+7*86400000),label:"This week"},
      lastweek:{from:lws,to:ws,label:"Last week"},
      month:{from:mo,to:new Date(now.getFullYear(),now.getMonth()+1,1),label:"This month"},
      lastmonth:{from:pmo,to:mo,label:"Last month"},
      ytd:{from:new Date(now.getFullYear(),0,1),to:new Date(now.getTime()+86400000),label:"Year to date"}
    };
    const k=R[key]?key:"week";
    return {...R[k], key:k, a:R[k].from.getTime(), b:R[k].to.getTime()};
  }
  const doneWO = j => isWO(j) && (j.status==="completed"||j.status==="picked_up");
  const doneAt = j => j.completedAt || (j.date ? new Date(j.date+"T12:00").getTime() : 0);
  function partCost(j,p){ const m=(db.woCosts||{})[j.id]||{}; if(m[p.lid]!=null&&m[p.lid]!=="") return Number(m[p.lid]); const inv=p.partId&&db.inventory.find(x=>x.id===p.partId); return inv&&inv.cost!=null?Number(inv.cost):null; }
  function moreReports(R, done, open, fin, card, tbl, sec){
    const tot=woTotals; let html="";
    if(sec==="profit"){
    if(fin||canCost()){ const rows=[]; let sell=0,cost=0,miss=0;
      for(const j of done) for(const p of (j.parts||[]).filter(p=>!p.declined)){ const q=Number(p.qty||0), c=partCost(j,p), pr=q*Number(p.price||0); sell+=pr;
        if(c==null){ miss++; rows.push(`<tr><td>${esc(p.desc)}</td><td>${esc((custOf(j)||{}).name||"")}</td><td class="num">${q}</td><td class="num muted">\u2014</td><td class="num">${money(pr)}</td><td class="num muted">\u2014</td></tr>`); continue; }
        cost+=q*c; rows.push(`<tr><td>${esc(p.desc)}</td><td>${esc((custOf(j)||{}).name||"")}</td><td class="num">${q}</td><td class="num">${money(q*c)}</td><td class="num">${money(pr)}</td><td class="num">${money(r2(pr-q*c))}</td></tr>`); }
      rows.push(`<tr><td><b>Total</b></td><td></td><td></td><td class="num"><b>${money(r2(cost))}</b></td><td class="num"><b>${money(r2(sell))}</b></td><td class="num"><b>${money(r2(sell-cost))}</b></td></tr>`);
      html+=card("Parts cost vs. price", tbl([["Part"],["Customer"],["Qty","num"],["Our cost","num"],["Sold for","num"],["Profit","num"]], rows)+(miss?`<div class="hint">${miss} part line${miss>1?"s have":" has"} no cost entered.</div>`:""));
    }
    }
    if(sec==="wip"){
    // appointments
    const appts=(db.appointments||[]).filter(a=>{ const ts=new Date(a.date+"T12:00").getTime(); return ts>=R.a&&ts<R.b; });
    const cnt=s=>appts.filter(a=>a.status===s).length, shown=appts.filter(a=>a.status!=="cancelled").length;
    html+=card("Appointments", tbl([["Measure"],["Count","num"]],[["Booked",appts.length],["Checked in",cnt("arrived")],["No-shows",cnt("no_show")],["Cancelled",cnt("cancelled")],
      ["No-show rate",shown?Math.round(cnt("no_show")/shown*100)+"%":"\u2013"],["Customers who waited",appts.filter(a=>a.type==="waiting").length]].map(([a,b])=>`<tr><td>${a}</td><td class="num">${b}</td></tr>`)));
    }
    if(sec==="parts"&&canCost()){
      // inventory value by vendor
      const vend={}; db.inventory.forEach(p=>{ const v=p.vendor||"Other", x=vend[v]=vend[v]||{n:0,cost:0,retail:0}; const q=Math.max(0,Number(p.qty||0)); x.n++; x.cost+=q*Number(p.cost||0); x.retail+=q*Number(p.price||0); });
      html+=card("Inventory value by vendor", tbl([["Vendor"],["Parts","num"],["Value at cost","num"],["Value at retail","num"]],
        Object.entries(vend).sort((a,b)=>b[1].cost-a[1].cost).map(([v,x])=>`<tr><td>${esc(v)}</td><td class="num">${x.n}</td><td class="num">${money(r2(x.cost))}</td><td class="num">${money(r2(x.retail))}</td></tr>`)));
    }

  function laterFor(j){

  function jobGroups(j, withDeclined){

  // shrink a phone photo so it fits comfortably in browser storage

  function shrinkImage(file,max=640,q=0.72){
    return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=rej;
      r.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement("canvas"); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",q)); };
        im.onerror=rej; im.src=r.result; };
      r.readAsDataURL(file); });
  }

    // read every field back into j (so re-renders keep typed values)

      const byKey=(arr,i,k,keyOf)=>{ if(k==="undefined"||k==="null") k=""; const a=arr[i]; if(a&&(!k||keyOf(a)===k)) return a; return k?arr.find(x=>keyOf(x)===k):null; };

    function bind(){

  function lightbox(urls, start, opt){
    opt=opt||{}; urls=(urls||[]).filter(Boolean); if(!urls.length) return; let i=Math.max(0,Math.min(start||0,urls.length-1));
    const el=document.createElement("div"); el.className="lb"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); el.setAttribute("aria-label","Photos");
    el.innerHTML=`<div class="lb-top"><span class="lb-n" aria-live="polite"></span><span class="spacer"></span>${opt.action?`<button class="lb-act" type="button">${esc(opt.action.label)}</button>`:""}<button class="lb-x" type="button" aria-label="Close">\u00d7</button></div>
      <div class="lb-stage"><div class="lb-track">${urls.map(u=>`<div class="lb-slide"><img src="${esc(u)}" alt=""></div>`).join("")}</div>
      ${urls.length>1?`<button class="lb-prev" type="button" aria-label="Previous photo">\u2039</button><button class="lb-next" type="button" aria-label="Next photo">\u203a</button>`:""}</div>
      ${urls.length>1?`<div class="lb-dots">${urls.map(()=>"<i></i>").join("")}</div>`:""}`;
    document.body.appendChild(el);
    const track=el.querySelector(".lb-track"), stage=el.querySelector(".lb-stage"), prevOv=document.body.style.overflow; document.body.style.overflow="hidden";
    const paint=(anim=true)=>{ track.style.transition=anim?"":"none"; track.style.transform=`translateX(${-i*100}%)`;
      el.querySelector(".lb-n").textContent=urls.length>1?`${i+1} of ${urls.length}`:"";
      el.querySelectorAll(".lb-dots i").forEach((d,k)=>d.classList.toggle("on",k===i));
      const p=el.querySelector(".lb-prev"), n=el.querySelector(".lb-next"); if(p) p.disabled=i===0; if(n) n.disabled=i===urls.length-1; };
    const go=k=>{ i=Math.max(0,Math.min(urls.length-1,k)); paint(); };
    const close=()=>{ document.removeEventListener("keydown",key,true); document.body.style.overflow=prevOv; el.remove(); };
    const key=e=>{ if(e.key==="Escape"){ e.preventDefault(); close(); } else if(e.key==="ArrowRight"){ e.preventDefault(); go(i+1); } else if(e.key==="ArrowLeft"){ e.preventDefault(); go(i-1); } };
    document.addEventListener("keydown",key,true);
    el.querySelector(".lb-x").onclick=close;
    const pv=el.querySelector(".lb-prev"), nx=el.querySelector(".lb-next"); if(pv) pv.onclick=()=>go(i-1); if(nx) nx.onclick=()=>go(i+1);
    if(opt.action){ const ab=el.querySelector(".lb-act"); ab.onclick=()=>opt.action.fn(i,close,ab); }
    // swipe / drag
    let x0=null, y0=0, dx=0, t0=0;
    stage.addEventListener("pointerdown",e=>{ if(e.target.closest("button")) return; x0=e.clientX; y0=e.clientY; dx=0; t0=Date.now(); track.style.transition="none"; try{ stage.setPointerCapture(e.pointerId); }catch(_){} });
    stage.addEventListener("pointermove",e=>{ if(x0==null) return; dx=e.clientX-x0; const edge=(i===0&&dx>0)||(i===urls.length-1&&dx<0); track.style.transform=`translateX(calc(${-i*100}% + ${edge?dx/3:dx}px))`; });
    const end=e=>{ if(x0==null) return; const w=stage.clientWidth||1, fast=Date.now()-t0<300&&Math.abs(dx)>30, dy=Math.abs((e.clientY||y0)-y0);
      x0=null; if((Math.abs(dx)>w*0.18||fast)&&Math.abs(dx)>dy) go(i+(dx<0?1:-1)); else if(Math.abs(dx)<6&&dy>80) close(); else paint(); };
    stage.addEventListener("pointerup",end); stage.addEventListener("pointercancel",end);
    paint(false); el.querySelector(".lb-x").focus();
    return {close};
  }

  // "today", "tomorrow", "friday", "11/20", "november 20", "the 20th" -> Date (noon)
  function vDate(s){
    s=String(s).toLowerCase(); const d=new Date(); d.setHours(12,0,0,0);
    if(/\btomorrow\b/.test(s)){ d.setDate(d.getDate()+1); return d; }
    if(/\btoday\b|\btonight\b|end of (the )?day/.test(s)) return d;
    const days=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
    for(let i=0;i<7;i++) if(new RegExp("\\b"+days[i]+"\\b").test(s)){ let k=(i-d.getDay()+7)%7||7; if(/\bnext\b/.test(s)&&k<7) k+=0; d.setDate(d.getDate()+k); return d; }

    if(m){ d.setMonth(months.indexOf(m[1]),+m[2]); if(d<new Date(Date.now()-864e5)) d.setFullYear(d.getFullYear()+1); return d; }
    m=s.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
    if(m){ d.setMonth(+m[1]-1,+m[2]); if(m[3]) d.setFullYear(m[3].length===2?2000+ +m[3]:+m[3]); return d; }
    m=s.match(/\bthe\s+(\d{1,2})(?:st|nd|rd|th)?\b/);
    if(m){ d.setDate(+m[1]); if(d<new Date(Date.now()-864e5)) d.setMonth(d.getMonth()+1); return d; }

        <div class="v-log" id="vLog"></div><div class="v-help hidden"></div>`;
      document.body.appendChild(p);
      p.querySelector("#vClose").onclick=()=>{ p.classList.add("hidden"); try{ vRec&&vRec.stop(); }catch(e){} };
      p.querySelector("#vMic").onclick=vListen;
      p.querySelector("#vHelpBtn").onclick=()=>{ const h=p.querySelector(".v-help"); if(h.classList.contains("hidden")) vShowHelp(); else h.classList.add("hidden"); };
      p.querySelector("#vForm").onsubmit=e=>{ e.preventDefault(); try{ if(vOn&&vRec) vRec.abort(); }catch(_){} const i=$("#vText"); const t=i.value; i.value=""; vHandle(t); };
    }
    p.classList.remove("hidden");
  }
  function voiceSetup(){
    let b=$("#vFab");
    if(!me||me.role!=="manager"){ if(b) b.remove(); const p=$("#vPanel"); if(p) p.remove(); return; }
    if(b) return;
    b=document.createElement("button"); b.id="vFab"; b.className="v-fab no-print"; b.type="button"; b.setAttribute("aria-label","Voice commands");
    b.innerHTML=`<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
    b.onclick=()=>{ const p=$("#vPanel"); if(p&&!p.classList.contains("hidden")){ vListen(); return; } vOpen(); vListen(); };
    document.body.appendChild(b);
  }

  function modal(html, bind){
    $("#modalRoot").innerHTML=`<div class="modal-bg"><div class="modal">${html}</div></div>`;
    const root=$("#modalRoot .modal");
    $("#modalRoot .modal-bg").addEventListener("click",e=>{ if(e.target.classList.contains("modal-bg")) closeModal(); });
    root.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
    if(bind) bind(root);
  }
  function closeModal(){ $("#modalRoot").innerHTML=""; }

  (async()=>{ try{ const {data}=await sb.auth.getSession(); if(data&&data.session) await enter(data.session.user.id); }catch(e){} finally{ hideLoader(); } })();
})();
</script>
</body>
</html>
