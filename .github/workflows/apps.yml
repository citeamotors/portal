name: Build apps

# Builds the Mac app (.dmg) and the Android app (.apk) for the team portal.
# Both just open teams.citeamotors.com, so they only need rebuilding when the app shell changes (apps/ folder).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/apps.yml"]

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app (Apple silicon + Intel)
        working-directory: apps/mac
        run: |
          set -e
          swiftc -O -target arm64-apple-macos12 -o Citea-arm64 main.swift -framework Cocoa -framework WebKit
          swiftc -O -target x86_64-apple-macos12 -o Citea-x86_64 main.swift -framework Cocoa -framework WebKit
          APP="build/Citea Motors.app"; mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create Citea-arm64 Citea-x86_64 -output "$APP/Contents/MacOS/Citea"
          cp Info.plist "$APP/Contents/Info.plist"
          mkdir AppIcon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s icon-1024.png --out AppIcon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) icon-1024.png --out AppIcon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          codesign --force --deep -s - "$APP"
          codesign --verify --verbose "$APP"
          mkdir dmg; cp -R "$APP" dmg/; ln -s /Applications dmg/Applications
          hdiutil create -volname "Citea Motors" -srcfolder dmg -ov -format UDZO CiteaMotors.dmg
          ls -la CiteaMotors.dmg
      - uses: actions/upload-artifact@v4
        with: { name: mac-dmg, path: apps/mac/CiteaMotors.dmg }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build the app (signed afterwards with the shop's key, which is kept off GitHub)
        working-directory: apps/android
        run: |
          set -e
          gradle --no-daemon assembleRelease
          mkdir out; cp app/build/outputs/apk/release/app-release-unsigned.apk out/CiteaMotors-unsigned.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1); cp $BT/lib/apksigner.jar $BT/zipalign out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: android-unsigned, path: apps/android/out }
