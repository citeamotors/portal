name: Deploy portal

# Publishes the Citea Motors team portal (index.html) and customer page (approve.html) to GitHub Pages.
# The files live in this repo, in the site/ folder. Every push to main deploys them.
# You can also run it from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the demo portal (sample data only, runs in the visitor's browser)
        run: python3 tools/demo/build_demo.py
      - name: Check portal files
        run: |
          for f in index.html approve.html; do
            grep -q "Citea" "site/$f"
          done
          if [ -f CNAME ]; then cp CNAME site/CNAME; fi
          sha256sum site/*.html
          sha256sum site/index.html | cut -c1-16 > site/version.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Give GitHub a moment to register the upload
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
